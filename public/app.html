<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReviewReply – Dashboard</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap">
<nav><b><a href="/" style="color:inherit;text-decoration:none">ReviewReply</a></b><span id="who"></span></nav>
<div id="auth" class="card" hidden style="max-width:380px;margin:40px auto">
<h3 id="atitle">Sign in</h3><label>Email</label><input id="email" type="email" autocomplete="email">
<label>Password (8+ characters)</label><input id="pw" type="password" autocomplete="current-password">
<p class="err" id="aerr"></p><button class="btn" id="abtn">Sign in</button> <a href="#" id="toggle">Create account</a></div>
<div id="main" hidden>
<div class="card"><h3>Your business</h3><label>Business name</label><input id="biz" maxlength="120">
<label>Brand voice (e.g. "friendly, casual, mention we're family-owned")</label><textarea id="voice" rows="2" maxlength="400"></textarea>
<button class="btn ghost" id="save">Save</button></div><br>
<div class="card"><h3>Generate a reply</h3><label>Stars</label>
<select id="stars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
<label>Review text</label><textarea id="review" rows="5" maxlength="2000"></textarea>
<p class="err" id="gerr"></p><button class="btn" id="gen">Write reply</button>
<div id="out" class="out" hidden></div><p><button class="btn ghost" id="copy" hidden>Copy</button></p></div><br>
<div class="card" id="plan"></div></div>
<script>
const $=id=>document.getElementById(id);let signup=false;
const api=(p,b)=>fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(async r=>({ok:r.ok,s:r.status,j:await r.json().catch(()=>({}))}));
function show(me){$('auth').hidden=!!me;$('main').hidden=!me;$('who').innerHTML=me?me.email+' · <a href="#" id="lo">Sign out</a>':'';
 if(!me)return;$('biz').value=me.business;$('voice').value=me.voice;
 $('plan').innerHTML=me.plan==='pro'?`<b>Pro</b> · ${me.usedThisMonth}/300 replies this month · <a href="#" id="portal">Manage billing</a>`:`<b>Free</b> · ${me.freeLeft} free replies left · <button class="btn" id="up">Upgrade – $29/mo</button>`;
 if($('lo'))$('lo').onclick=async e=>{e.preventDefault();await api('/api/logout',{});location.reload()};
 if($('up'))$('up').onclick=async()=>{const r=await api('/api/checkout',{});r.j.url?location.href=r.j.url:alert(r.j.error)};
 if($('portal'))$('portal').onclick=async e=>{e.preventDefault();const r=await api('/api/portal',{});r.j.url?location.href=r.j.url:alert(r.j.error)}}
async function load(){const r=await api('/api/me');show(r.ok?r.j:null)}
$('toggle').onclick=e=>{e.preventDefault();signup=!signup;$('atitle').textContent=signup?'Create account':'Sign in';$('abtn').textContent=signup?'Sign up':'Sign in';$('toggle').textContent=signup?'Have an account?':'Create account'};
$('abtn').onclick=async()=>{const r=await api(signup?'/api/signup':'/api/login',{email:$('email').value,password:$('pw').value});r.ok?load():$('aerr').textContent=r.j.error};
$('save').onclick=async()=>{await api('/api/profile',{business:$('biz').value,voice:$('voice').value});$('save').textContent='Saved ✓';setTimeout(()=>$('save').textContent='Save',1500)};
$('gen').onclick=async()=>{$('gerr').textContent='';$('gen').disabled=true;const r=await api('/api/generate',{stars:$('stars').value,review:$('review').value});$('gen').disabled=false;
 if(!r.ok){$('gerr').textContent=r.j.error;return}$('out').hidden=false;$('out').textContent=r.j.reply;$('copy').hidden=false;show(r.j.email?r.j:null)};
$('copy').onclick=()=>navigator.clipboard.writeText($('out').textContent);
load();</script></div></body></html>
